<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homescreen Labs</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-flask-conical%22%3E%3Cpath%20d%3D%22M14%202v6a2%202%200%200%200%20.245.96l5.51%2010.08A2%202%200%200%201%2018%2022H6a2%202%200%200%201-1.755-2.96l5.51-10.08A2%202%200%200%200%2010%208V2%22%2F%3E%3Cpath%20d%3D%22M6.453%2015h11.094%22%2F%3E%3Cpath%20d%3D%22M8.5%202h7%22%2F%3E%3C%2Fsvg%3E">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --accent-labs: #0aff16;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.08);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .ui-layer {
            position: relative;
            z-index: 2;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            animation: fadeIn 0.8s var(--ease-out);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .labs-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-labs);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.5px;
            background: rgba(10, 255, 22, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(10, 255, 22, 0.2);
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s var(--ease-out), background 0.2s ease;
        }

        .labs-badge:hover {
            transform: scale(1.05);
            background: rgba(10, 255, 22, 0.18);
        }

        .clock {
            font-size: 42px;
            font-weight: 200;
            letter-spacing: -1px;
            line-height: 1;
        }

        .date {
            font-size: 14px;
            opacity: 0.5;
            margin-top: 4px;
            text-transform: capitalize;
        }

        /* Buscador */
        .search-container {
            position: relative;
            margin-bottom: 20px;
            animation: slideDown 0.6s var(--ease-out);
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s var(--ease-out);
            box-sizing: border-box;
        }

        .search-input:focus {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            pointer-events: none;
            width: 18px;
            height: 18px;
            transition: opacity 0.3s ease;
        }

        .search-input:focus + .search-icon {
            opacity: 0.9;
            color: var(--accent-labs);
        }

        /* Lista de Experimentos */
        .experiments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .experiment-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            text-decoration: none;
            color: inherit;
            opacity: 0;
            animation: fadeInUp 0.5s var(--ease-out) forwards;
            transition: transform 0.25s var(--ease-out), background 0.2s ease, border-color 0.2s ease, box-shadow 0.25s ease;
        }

        .experiment-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .experiment-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        .experiment-main {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .experiment-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            flex-shrink: 0;
            color: #fff;
            transition: transform 0.3s var(--ease-out), color 0.3s ease;
        }

        .experiment-card:hover .experiment-icon {
            transform: scale(1.08) rotate(-3deg);
            color: var(--accent-labs);
        }

        .experiment-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .experiment-title {
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .experiment-desc {
            font-size: 13px;
            opacity: 0.6;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags-container {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            opacity: 0.7;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        .experiment-card:hover .tag {
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.12);
        }

        .experiment-action {
            opacity: 0.3;
            margin-left: 12px;
            transition: transform 0.25s var(--ease-out), opacity 0.2s ease, color 0.2s ease;
            flex-shrink: 0;
        }

        .experiment-card:hover .experiment-action {
            opacity: 0.9;
            transform: translateX(4px);
            color: var(--accent-labs);
        }

        /* Cartel / Modal de Bienvenida */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--ease-out);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .welcome-card {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s var(--ease-out);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .welcome-card {
            transform: scale(1) translateY(0);
        }

        .welcome-icon {
            width: 56px;
            height: 56px;
            background: rgba(10, 255, 22, 0.12);
            border: 1px solid rgba(10, 255, 22, 0.3);
            border-radius: 18px;
            color: var(--accent-labs);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }

        .welcome-title {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .welcome-text {
            font-size: 16px;
            opacity: 0.7;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .welcome-btn {
            background: var(--accent-labs);
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s var(--ease-out), filter 0.2s ease;
        }

        .welcome-btn:hover {
            transform: scale(1.04);
            filter: brightness(1.1);
        }

        .welcome-btn:active {
            transform: scale(0.98);
        }

        /* Botón de retorno */
        .return-chip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid var(--border-card);
            padding: 8px 16px;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            backdrop-filter: blur(20px);
            z-index: 10;
            transition: transform 0.2s var(--ease-out), background 0.2s ease;
        }

        .return-chip:hover {
            background: rgba(30, 30, 30, 0.95);
            transform: translateX(-50%) translateY(-2px);
        }

        /* KEYFRAMES */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.5;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body class="bg-active">

    <canvas id="bgCanvas"></canvas>

    <div class="ui-layer">
        <header class="header">
            <div class="labs-badge" id="infoBtn" title="Ver explicación">
                <i data-lucide="flask-conical" style="width: 14px; height: 14px;"></i>
                <span>HOMESCREEN LABS</span>
            </div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">--</div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar experimento, tags o keywords..." autocomplete="off">
            <i data-lucide="search" class="search-icon"></i>
        </div>

        <div class="experiments-list" id="experimentsContainer"></div>
    </div>

    <!-- Modal de Bienvenida -->
    <div class="modal-overlay" id="welcomeModal">
        <div class="welcome-card">
            <div class="welcome-icon">
                <i data-lucide="flask-conical" style="width: 28px; height: 28px;"></i>
            </div>
            <div class="welcome-title">Bienvenido a Homescreen Labs</div>
            <p class="welcome-text">
                En <i>Homescreen Labs</i> encontrarás <strong>utilidades experimentales, herramientas secundarias y prototipos.</strong> Aquí no hay carpetas ni funciones complejas: solo una lista directa y rápida de experimentos.
            </p>
            <button class="welcome-btn" id="closeWelcomeBtn">Entendido</button>
        </div>
    </div>

    <a href="https://capybaragalaxy.github.io/HOMESCREEN/" class="return-chip">
        <i data-lucide="monitor-smartphone" style="width: 16px; height: 16px;"></i>
        <span>Volver a Homescreen Principal</span>
    </a>

    <script>
        /* Registro de experimentos plano */
        const experiments = [
                        {
    "title": "Day Briefing",
    "description": "Revisa tus tareas pendientes, calendario y estado del tiempo para hoy.",
    "icon": "Calendar-Days",
    "url": "Apps/day-brief.html",
    "tags": ["Productividad", "Daily"],
    "keywords": ["briefing", "tareas", "calendario", "tiempo", "clima"]
},
        {
                title: "Eso es todo por ahora",
                description: "Vuelve más tarde para ver nuevas utilidades experimentales.",
                icon: "badge-info",
                url: "about.html",
                tags: ["Info"],
                keywords: ["about", "help", "version", "docs"]
            }
        ];

        const container = document.getElementById('experimentsContainer');
        const searchInput = document.getElementById('searchInput');
        const welcomeModal = document.getElementById('welcomeModal');
        const closeWelcomeBtn = document.getElementById('closeWelcomeBtn');
        const infoBtn = document.getElementById('infoBtn');

        function renderExperiments(items) {
            if (!items.length) {
                container.innerHTML = `<div class="no-results">No se encontraron experimentos con ese término.</div>`;
                return;
            }

            container.innerHTML = items.map((exp, index) => {
                const iconName = exp.icon || 'flask-conical';
                const descHtml = exp.description ? `<span class="experiment-desc">${exp.description}</span>` : '';
                const tagsHtml = exp.tags && exp.tags.length 
                    ? `<div class="tags-container">${exp.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` 
                    : '';
                const delay = (index * 0.05).toFixed(2);

                return `
                    <a href="${exp.url}" class="experiment-card" style="animation-delay: ${delay}s">
                        <div class="experiment-main">
                            <div class="experiment-icon">
                                <i data-lucide="${iconName}" style="width: 20px; height: 20px;"></i>
                            </div>
                            <div class="experiment-info">
                                <span class="experiment-title">${exp.title}</span>
                                ${descHtml}
                                ${tagsHtml}
                            </div>
                        </div>
                        <i data-lucide="arrow-right" class="experiment-action" style="width: 18px; height: 18px;"></i>
                    </a>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function filterExperiments(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderExperiments(experiments);
                return;
            }

            const filtered = experiments.filter(exp => {
                const titleMatch = exp.title.toLowerCase().includes(q);
                const descMatch = exp.description ? exp.description.toLowerCase().includes(q) : false;
                const tagMatch = exp.tags ? exp.tags.some(t => t.toLowerCase().includes(q)) : false;
                const keywordMatch = exp.keywords ? exp.keywords.some(k => k.toLowerCase().includes(q)) : false;

                return titleMatch || descMatch || tagMatch || keywordMatch;
            });

            renderExperiments(filtered);
        }

        searchInput.addEventListener('input', (e) => filterExperiments(e.target.value));

        /* MANEJO DEL MODAL DE BIENVENIDA */
        function openWelcomeModal() {
            welcomeModal.classList.add('active');
        }

        function closeWelcomeModal() {
            welcomeModal.classList.remove('active');
        }

        closeWelcomeBtn.addEventListener('click', closeWelcomeModal);
        infoBtn.addEventListener('click', openWelcomeModal);

        /* RELOJ Y FECHA */
        function updateClock() {
            const n = new Date();
            document.getElementById('clock').innerText = n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = n.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);

        /* FONDO ANIMADO DE PARTÍCULAS */
        let particles = [], canvas = document.getElementById('bgCanvas'), ctx = canvas.getContext('2d');
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 45; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);

        /* INICIALIZACIÓN */
        window.onload = () => {
            updateClock();
            initCanvas();
            animate();
            renderExperiments(experiments);
            
            // Muestra el modal explicativo cada vez que se carga la página
            setTimeout(openWelcomeModal, 200);
        };
    </script>
</body>
</html>
