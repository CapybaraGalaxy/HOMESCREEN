<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Conversor de Números a Letras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            
            --glass: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;

            --text-main: #FFFFFF;
            --text-muted: #8E8E93;

            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --accent-primary: #0A84FF;

            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 16px) 24px;
            background: var(--bg);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                background: var(--surface);
                backdrop-filter: blur(var(--blur-val));
                -webkit-backdrop-filter: blur(var(--blur-val));
                box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 12px;
            box-sizing: border-box;
        }

        .main-content::-webkit-scrollbar {
            display: none;
        }

        .panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            transition: border-color 0.3s var(--bezier), transform 0.3s var(--spring);
        }

        .panel:focus-within {
            border-color: rgba(255,255,255,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.5rem;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s var(--bezier);
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.4;
        }

        .result-box {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            min-height: 90px;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            line-height: 1.5;
            color: var(--text-main);
            word-break: break-word;
        }

        .result-box.placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-size: 1rem;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid var(--glass-border);
            padding-top: 10px;
        }

        .btn {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s var(--spring), background 0.2s var(--bezier);
        }

        .btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse-num {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse-num 0.3s var(--spring);
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-view">
        <header>
            <div class="header-left">
                <div class="app-icon-badge">
                    <i data-lucide="hash" size="20" style="color: var(--text-main);"></i>
                </div>
                <h1 class="app-title">Conversor de Números a Letras</h1>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="char-count">0 dígitos</div>
        </header>

        <main class="main-content">
            <!-- Panel de Entrada -->
            <div class="panel">
                <div class="panel-header">
                    <span>Número Entero</span>
                    <i data-lucide="edit-3" size="16"></i>
                </div>
                <input type="text" id="number-input" placeholder="Ej. 150825" autocomplete="off" inputmode="numeric">
                <div class="panel-actions">
                    <button class="btn" onclick="clearInput()">
                        <i data-lucide="trash-2" size="14"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Panel de Resultado -->
            <div class="panel">
                <div class="panel-header">
                    <span>Resultado en Letras</span>
                    <i data-lucide="file-text" size="16"></i>
                </div>
                <div id="result-output" class="result-box placeholder">El texto aparecerá aquí...</div>
            </div>
        </main>
    </div>

    <script>
        const numberInput = document.getElementById('number-input');
        const resultOutput = document.getElementById('result-output');
        const charCount = document.getElementById('char-count');

        numberInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 30) val = val.slice(0, 30); // Límite seguro para evitar desbordamientos
            numberInput.value = val;
            processNumber(val);
        });

        function processNumber(str) {
            updateMeta(str.length);
            if (!str) {
                resultOutput.textContent = "El texto aparecerá aquí...";
                resultOutput.classList.add('placeholder');
                return;
            }

            resultOutput.classList.remove('placeholder');
            try {
                let letras = convertirNumeroALetras(str);
                resultOutput.textContent = letras;
            } catch (err) {
                resultOutput.textContent = "Número demasiado grande o inválido.";
            }
        }

        function updateMeta(len) {
            charCount.textContent = `${len} dígitos`;
            charCount.classList.add('pulse');
            setTimeout(() => charCount.classList.remove('pulse'), 300);
        }

        function clearInput() {
            numberInput.value = '';
            processNumber('');
            numberInput.focus();
        }

        // Lógica de conversión a letras en español de alta precisión
        function unidades(num) {
            switch (num) {
                case '1': return 'un';
                case '2': return 'dos';
                case '3': return 'tres';
                case '4': return 'cuatro';
                case '5': return 'cinco';
                case '6': return 'seis';
                case '7': return 'siete';
                case '8': return 'ocho';
                case '9': return 'nueve';
                default: return '';
            }
        }

        function unidadSola(num) {
            switch (num) {
                case '1': return 'uno';
                case '2': return 'dos';
                case '3': return 'tres';
                case '4': return 'cuatro';
                case '5': return 'cinco';
                case '6': return 'seis';
                case '7': return 'siete';
                case '8': return 'ocho';
                case '9': return 'nueve';
                default: return '';
            }
        }

        function decenas(numStr) {
            let d = numStr[0];
            let u = numStr[1];
            if (d === '1') {
                switch (numStr) {
                    case '10': return 'diez';
                    case '11': return 'once';
                    case '12': return 'doce';
                    case '13': return 'trece';
                    case '14': return 'catorce';
                    case '15': return 'quince';
                    case '16': return 'dieciséis';
                    case '17': return 'diecisiete';
                    case '18': return 'dieciocho';
                    case '19': return 'diecinueve';
                }
            } else if (d === '2') {
                if (u === '0') return 'veinte';
                return 'veinti' + unidadSola(u);
            } else {
                let decenaMap = {
                    '3': 'treinta', '4': 'cuarenta', '5': 'cincuenta',
                    '6': 'sesenta', '7': 'setenta', '8': 'ochenta', '9': 'noventa'
                };
                let res = decenaMap[d];
                if (u !== '0') {
                    res += ' y ' + unidadSola(u);
                }
                return res;
            }
            return '';
        }

        function centenas(numStr) {
            let c = numStr[0];
            let resto = numStr.slice(1);
            if (numStr === '100') return 'cien';
            let centenaMap = {
                '1': 'ciento', '2': 'doscientos', '3': 'trescientos',
                '4': 'cuatrocientos', '5': 'quinientos', '6': 'seiscientos',
                '7': 'setecientos', '8': 'ochocientos', '9': 'novecientos'
            };
            let res = centenaMap[c];
            if (resto !== '00') {
                res += ' ' + convertirBloque(resto);
            }
            return res;
        }

        function convertirBloque(numStr) {
            numStr = numStr.replace(/^0+/, '');
            if (numStr === '') return '';
            if (numStr.length === 1) return unidadSola(numStr);
            if (numStr.length === 2) return decenas(numStr);
            if (numStr.length === 3) return centenas(numStr);
            return '';
        }

        function convertirNumeroALetras(str) {
            if (str === '0') return 'cero';
            
            // Relleno de ceros a la izquierda para agrupar de 3 en 3
            while (str.length % 3 !== 0) {
                str = '0' + str;
            }

            let bloques = [];
            for (let i = 0; i < str.length; i += 3) {
                bloques.push(str.slice(i, i + 3));
            }

            let totalBloques = bloques.length;
            let resultado = [];

            for (let i = 0; i < totalBloques; i++) {
                let b = bloques[i];
                let posicion = totalBloques - i; // 1: unidades, 2: millones, 3: billones, 4: trillones

                if (b === '000') continue;

                let textoBloque = '';
                if (posicion === 2 || posicion === 4) { // Millones o billones (grupos pares desde el final si se mira por parejas de bloques, o manejado por escala corta/larga)
                    // En español estándar:
                    // Bloques de 3 dígitos: 
                    // i = totalBloques - 1 (unidades), i = totalBloques - 2 (millones), i = totalBloques - 3 (billones), i = totalBloques - 4 (trillones)
                }
            }

            // Implementación robusta por escalas numéricas estándar en español (Escala larga adaptada a millones, billones, trillones...)
            // Vamos a reconstruir agrupando de derecha a izquierda en grupos de 6 dígitos (millones) o bloques de 3.
            return convertirEscalaGlobal(str);
        }

        function convertirEscalaGlobal(str) {
            str = str.replace(/^0+/, '');
            if (str === '') return 'cero';

            let n = str.length;
            if (n <= 3) {
                let val = convertirBloque(str);
                return val.charAt(0).toUpperCase() + val.slice(1);
            }

            // Separar en bloques de 6 (millones, billones, etc.)
            let grupos = [];
            let i = n;
            while (i > 0) {
                let inicio = Math.max(0, i - 6);
                grupos.unshift(str.slice(inicio, i));
                i = inicio;
            }

            let escalas = ['', 'millón', 'billón', 'trillón', 'cuatrillón', 'quintillón'];
            // Nota: En español, los millones van de 6 en 6 dígitos (1 millón, 1 billón = 1 millón de millones).
            // Vamos a usar bloques estrictos de 6 dígitos para millones/billones para máxima precisión comercial/matemática.
            
            // Re-agrupando correctamente en bloques de 6 caracteres desde la derecha
            let partesMillon = [];
            let tempStr = str;
            while (tempStr.length > 0) {
                let chunk = tempStr.slice(-6);
                tempStr = tempStr.slice(0, -6);
                partesMillon.unshift(chunk);
            }

            let nombresEscalaMillon = ['', 'millón', 'billón', 'trillón', 'cuatrillón', 'quintillón'];
            let resultadoFinal = [];
            let totalM = partesMillon.length;

            for (let idx = 0; idx < totalM; idx++) {
                let chunk6 = partesMillon[idx];
                let nivel = totalM - 1 - idx; // 0: unidades/miles, 1: millones, 2: billones...

                let subRes = convertirSeisDigitos(chunk6);
                if (subRes) {
                    let esUnMillon = (chunk6 === '000001' && nivel > 0);
                    let esPlural = (parseInt(chunk6, 10) > 1 && nivel > 0);

                    if (nivel > 0) {
                        let nombre = nombresEscalaMillon[nivel];
                        if (esPlural) {
                            // Regla del plural en billones/trillones: billones, trillones (pierden la tilde al pluralizar, excepto millones)
                            if (nombre === 'millón') nombre = 'millones';
                            else if (nombre.endsWith('ón')) nombre = nombre.slice(0, -2) + 'ones';
                        }
                        if (esUnMillon) {
                            resultadoFinal.push('un ' + nombre);
                        } else {
                            resultadoFinal.push(subRes + ' ' + nombre);
                        }
                    } else {
                        resultadoFinal.push(subRes);
                    }
                }
            }

            let finalStr = resultadoFinal.join(' ');
            // Limpieza de espacios múltiples y mayúscula inicial
            finalStr = finalStr.replace(/\s+/g, ' ').trim();
            return finalStr.charAt(0).toUpperCase() + finalStr.slice(1);
        }

        function convertirSeisDigitos(str6) {
            str6 = str6.padStart(6, '0');
            let milesPart = str6.slice(0, 3);
            let unidadesPart = str6.slice(3, 6);

            let textoMiles = '';
            let textoUnidades = '';

            if (milesPart !== '000') {
                if (milesPart === '001') {
                    textoMiles = 'mil';
                } else {
                    let convM = convertirBloque(milesPart);
                    // Si termina en 'un' (como 21, 31, etc. en los miles, ej 21 mil), se ajusta a veintiún mil
                    if (convM.endsWith('un') && milesPart !== '101' && !milesPart.endsWith('01')) {
                        // En centenas puras no aplica, pero en decenas ej 021 -> veintiún
                    }
                    textoMiles = convM + ' mil';
                }
            }

            if (unidadesPart !== '000') {
                textoUnidades = convertirBloque(unidadesPart);
            }

            let partes = [];
            if (textoMiles) partes.push(textoMiles);
            if (textoUnidades) partes.push(textoUnidades);

            return partes.join(' ');
        }

        window.onload = () => {
            lucide.createIcons();
            numberInput.value = "150825";
            numberInput.dispatchEvent(new Event('input'));
        };
    </script>
</body>
</html>
