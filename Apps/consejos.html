    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;

            --glass: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;

            --text-main: #FFFFFF;
            --text-muted: #8E8E93;

            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --accent-primary: #0A84FF;

            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app-container {
            max-width: 900px;
            min-height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 16px) 24px;
            position: relative;
        }

        /* Cabecera */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title-group h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .article-counter {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
            transition: transform 0.3s var(--spring);
        }

        .article-counter.pulse {
            transform: scale(1.1);
            color: var(--accent-primary);
        }

        /* Buscador Inteligente */
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 16px 12px 42px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s var(--bezier);
        }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: var(--surface-hover);
            transform: scale(1.01);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .search-input:focus~.search-icon {
            color: var(--accent-primary);
        }

        /* Píldoras de Categorías */
        .folders-scroll-area {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 8px;
        }

        .folders-scroll-area::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s var(--spring);
            user-select: none;
        }

        .category-pill:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .category-pill.active {
            background: var(--text-main);
            color: var(--bg);
            border-color: var(--text-main);
            font-weight: 500;
            transform: scale(1.03);
        }

        /* Listado de Artículos */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            align-content: start;
            padding-bottom: 24px;
            transition: opacity 0.15s ease;
        }

        .main-content.fade-out {
            opacity: 0;
        }

        .article-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 0 0 20px 0;
            cursor: pointer;
            transition: transform 0.25s var(--bezier), background 0.2s ease, border-color 0.2s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.4s var(--bezier) backwards;
            overflow: hidden;
        }

        .article-card:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(0.98);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .article-cover {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: var(--surface-hover);
            border-bottom: 1px solid var(--glass-border);
        }

        .article-card-body {
            padding: 16px 20px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .article-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
        }

        .article-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .article-card h3 {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .article-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Barra de Progreso de Lectura */
        .reading-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 101;
        }

        .reading-progress-bar {
            height: 100%;
            background: var(--accent-primary);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Vista de Lector (Modal Overlay) */
        .reader-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            pointer-events: none;
            transition: opacity 0.3s var(--bezier), transform 0.3s var(--bezier);
        }

        .reader-modal.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .reader-header {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .back-btn:hover {
            background: var(--surface-hover);
            transform: scale(1.02);
        }

        .reader-body-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px 24px;
            display: flex;
            justify-content: center;
            scroll-behavior: smooth;
        }

        .reader-content {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .reader-content h2 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .reader-meta-info {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 16px;
        }

        /* Contenido enriquecido de Artículos */
        .article-body {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #D1D1D6;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .article-body p {
            margin-bottom: 8px;
        }

        .article-body h3 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-top: 12px;
            font-weight: 500;
        }

        .article-body img {
            width: 100%;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid var(--glass-border);
            object-fit: cover;
            max-height: 380px;
            background: var(--surface);
            transition: transform 0.3s ease;
        }

        .article-body img:hover {
            transform: scale(1.02);
        }

        /* Estilo para combinaciones de teclado <kbd> */
        kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-width: 2px;
            border-radius: 6px;
            padding: 3px 8px;
            font-family: 'Outfit', monospace;
            font-size: 0.85rem;
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            display: inline-block;
            margin: 0 2px;
        }

        /* Estado Vacío */
        .empty-state {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            gap: 12px;
        }

        .empty-state i {
            color: var(--text-muted);
            opacity: 0.4;
        }

        @media(max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .empty-state {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="reading-progress-container">
        <div class="reading-progress-bar" id="reading-progress-bar"></div>
    </div>

    <div class="app-container" id="main-view">
        <header>
            <div class="header-left">
                <div class="app-icon-badge">
                    <i data-lucide="lightbulb" size="20" style="color: var(--text-main);"></i>
                </div>
                <div class="app-title-group">
                    <h1>Centro de Consejos</h1>
                </div>
            </div>
            <div class="article-counter" id="article-counter">0 guías</div>

        <div class="search-container">
            <input type="text" class="search-input" id="search-input"
                placeholder="Buscar guías, atajos o tutoriales...">
            <i data-lucide="search" size="18" class="search-icon"></i>
        </div>

        <div class="folders-scroll-area" id="categories-container"></div>

        <main class="main-content" id="articles-list"></main>
    </div>

    <div class="reader-modal" id="reader-modal">
        <div class="reader-header">
            <button class="back-btn" onclick="closeArticleModal()">
                <i data-lucide="arrow-left" size="18"></i>
                <span>Volver</span>
            </button>
            <div id="modal-category-badge" class="article-badge">Categoría</div>
        </div>
        <div class="reader-body-container" id="reader-body-container">
            <div class="reader-content" id="reader-content-inner"></div>
        </div>
    </div>

        let appData = {
            articles: [],
            currentCategory: 'Todos',
            searchQuery: ''
        };

        let currentActiveArticle = null;
        let isModalOpen = false;

        function getReadingStats(html) {
            const text = html.replace(/<[^>]+>/g, " ");
            const words = text.trim().split(/\s+/).filter(Boolean).length;
            const minutes = Math.max(1, Math.ceil(words / 220));
            return {
                words,
                minutes,
                readTime: `${minutes} min lectura`
            };
        }

        function initApp() {
            let baseArticles = DEFAULT_ARTICLES;

            appData.articles = baseArticles.map(article => {
                const stats = getReadingStats(article.content);
                return {
                    ...article,
                    readTime: stats.readTime,
                    words: stats.words,
                    minutes: stats.minutes
                };
            });

            setupEventListeners();
            renderApp();
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                const listContainer = document.getElementById('articles-list');

                listContainer.classList.add('fade-out');
                setTimeout(() => {
                    appData.searchQuery = query;
                    renderArticlesList();
                    listContainer.classList.remove('fade-out');
                }, 150);
            });

            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    closeArticleModal();
                }
            });

            const readerBody = document.getElementById('reader-body-container');
            readerBody.addEventListener('scroll', () => {
                const scrollTop = readerBody.scrollTop;
                const scrollHeight = readerBody.scrollHeight - readerBody.clientHeight;
                const scrollPercent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;

                document.getElementById('reading-progress-bar').style.width = scrollPercent + '%';

                if (currentActiveArticle) {
                    const remainingMins = Math.max(0, Math.ceil(currentActiveArticle.minutes * (1 - scrollPercent / 100)));
                    const timeElem = document.getElementById('modal-remaining-time');
                    if (timeElem) {
                        timeElem.textContent = remainingMins === 0 ? 'Finalizado' : `${remainingMins} min restantes`;
                    }
                }
            });
        }

        function renderApp() {
            renderCategories();
            renderArticlesList();
            updateCounter();
            refreshIcons();
        }

        function refreshIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const categories = ['Todos', ...new Set(appData.articles.map(a => a.category))];

            container.innerHTML = categories.map(cat => `
                <div class="category-pill ${appData.currentCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
                    ${cat}
                </div>
            `).join('');
        }

        function selectCategory(cat) {
            appData.currentCategory = cat;
            renderApp();
        }

        function renderArticlesList() {
            const listContainer = document.getElementById('articles-list');

            const filtered = appData.articles.filter(article => {
                const matchesCategory = appData.currentCategory === 'Todos' || article.category === appData.currentCategory;
                const plainContent = article.content.replace(/<[^>]+>/g, "").toLowerCase();
                const matchesSearch = article.title.toLowerCase().includes(appData.searchQuery) ||
                    article.summary.toLowerCase().includes(appData.searchQuery) ||
                    plainContent.includes(appData.searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i data-lucide="folder-search" size="48"></i>
                        <p>No se encontraron guías que coincidan con tu búsqueda.</p>
                    </div>
                `;
                refreshIcons();
                return;
            }

            const PLACEHOLDER_IMG = 'https://i.imgur.com/KI4HWGG.png';

            listContainer.innerHTML = filtered.map((article, index) => {
                const match = article.content.match(/<img[^>]+src=["']([^"']+)["']/i);
                const coverUrl = match ? match[1] : PLACEHOLDER_IMG;

                return `
                <div class="article-card" style="animation-delay: ${index * 40}ms;" onclick="openArticle('${article.id}')">
                    <img class="article-cover" src="${coverUrl}" alt="${article.title}">
                    <div class="article-card-body">
                        <div class="article-card-header">
                            <span class="article-badge">${article.category}</span>
                            <span class="article-time">${article.minutes} min</span>
                        </div>
                        <h3>${article.title}</h3>
                        <p>${article.summary}</p>
                    </div>
                </div>
                `;
            }).join('');

            refreshIcons();
        }

        function updateCounter() {
            const counter = document.getElementById('article-counter');
            const count = appData.articles.length;
            counter.textContent = `${count} ${count === 1 ? 'guía' : 'guías'}`;
            counter.classList.add('pulse');
            setTimeout(() => counter.classList.remove('pulse'), 300);
        }

        function openArticle(id) {
            const article = appData.articles.find(a => a.id === id);
            if (!article) return;

            currentActiveArticle = article;

            document.getElementById('modal-category-badge').textContent = article.category;
            document.getElementById('reader-content-inner').innerHTML = `
                <h2>${article.title}</h2>
                <div class="reader-meta-info">
                    <span><i data-lucide="calendar" size="14"></i> ${article.date}</span>
                    <span>•</span>
                    <span><i data-lucide="clock" size="14"></i> ${article.readTime}</span>
                    <span>•</span>
                    <span id="modal-remaining-time">${article.minutes} min restantes</span>
                </div>
                <div class="article-body">
                    ${article.content}
                </div>
            `;

            document.getElementById('reader-modal').classList.add('active');

            if (!isModalOpen) {
                window.history.pushState({ modalOpen: true }, "");
                isModalOpen = true;
            }

            document.getElementById('reader-body-container').scrollTop = 0;
            document.getElementById('reading-progress-bar').style.width = '0%';

            refreshIcons();
        }

        function closeArticleModal() {
            if (isModalOpen) {
                window.history.back();
            }
        }

        window.addEventListener('popstate', () => {
            const modal = document.getElementById('reader-modal');
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                isModalOpen = false;
            }
        });

        window.onload = initApp;
    </script>
