<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contador de Palabras</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-binary-icon%20lucide-binary%22%3E%3Cstyle%3E%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23000000%20!important%3B%20%7D%20%40media%20(prefers-color-scheme%3A%20dark)%20%7B%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23ffffff%20!important%3B%20%7D%20%7D%20%3C%2Fstyle%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%224%22%20height%3D%226%22%20rx%3D%222%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%224%22%20width%3D%224%22%20height%3D%226%22%20rx%3D%222%22%2F%3E%3Cpath%20d%3D%22M6%2020h4%22%2F%3E%3Cpath%20d%3D%22M14%2010h4%22%2F%3E%3Cpath%20d%3D%22M6%2014h2v6%22%2F%3E%3Cpath%20d%3D%22M14%204h2v6%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            --glass: rgba(15, 15, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-blue: #0A84FF;
            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100dvh;
            max-width: 900px;
            margin: 0 auto;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 24px) 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 10px 0;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon-badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .header-title-container h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        @media (min-width: 768px) {
            .workspace {
                grid-template-columns: 3fr 1fr;
            }
        }

        .editor-container {
            background: var(--glass);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-height: 0;
        }

        .editor-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            outline: none;
        }

        .editor-textarea::placeholder {
            color: var(--text-muted);
        }

        .metrics-panel {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
        }

        @media (min-width: 768px) {
            .metrics-panel {
                flex-direction: column;
                flex-wrap: nowrap;
            }
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.2s var(--spring);
            position: relative;
        }

        .metric-card.interactive {
            cursor: pointer;
            user-select: none;
        }

        .metric-card.interactive:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metric-sublabel {
            font-size: 0.7rem;
            color: var(--accent-blue);
            font-weight: 500;
            margin-top: 2px;
        }

        /* Menú flotante y responsivo para opciones de lectura */
        .reading-menu {
            display: none;
            position: fixed;
            background: rgba(22, 22, 24, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px;
            width: min(260px, 90vw);
            max-height: min(320px, 60vh);
            overflow-y: auto;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            z-index: 9999;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        .reading-menu.active {
            display: flex;
        }

        .menu-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 4px 8px;
            letter-spacing: 0.05em;
        }

        .menu-options-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .menu-option {
            padding: 8px 10px;
            font-size: 0.85rem;
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
        }

        .menu-option:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .menu-option.selected {
            color: var(--accent-blue);
            font-weight: 600;
            background: rgba(10, 132, 255, 0.12);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-brand">
                <div class="app-icon-badge">
                    <i data-lucide="binary" size="22" style="color: var(--text-main);"></i>
                </div>
                <div class="header-title-container">
                    <h1>Contador de Palabras</h1>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="workspace">
                <div class="editor-container">
                    <textarea class="editor-textarea" id="text-input" placeholder="Pega o escribe tu texto aquí para analizarlo al instante..." oninput="analyzeText()"></textarea>
                </div>

                <div class="metrics-panel">
                    <div class="metric-card">
                        <span class="metric-value" id="count-words">0</span>
                        <span class="metric-label">Palabras</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-value" id="count-chars">0</span>
                        <span class="metric-label">Caracteres</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-value" id="count-paragraphs">0</span>
                        <span class="metric-label">Párrafos</span>
                    </div>
                    
                    <div class="metric-card interactive" id="reading-card" onclick="toggleReadingMenu(event)">
                        <span class="metric-value" id="count-reading">0m</span>
                        <span class="metric-label">
                            Lectura aprox.
                            <i data-lucide="chevron-down" size="14"></i>
                        </span>
                        <span class="metric-sublabel" id="reading-mode-label">Mental (Normal)</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Menú desplegable flotante adaptativo -->
    <div class="reading-menu" id="reading-menu" onclick="event.stopPropagation()">
        <div class="menu-section-title">Lectura Oral</div>
        <div class="menu-options-group">
            <div class="menu-option" onclick="setReadingMode('oral', 'lento', 110, event)">Lento <span>110 ppm</span></div>
            <div class="menu-option" onclick="setReadingMode('oral', 'normal', 140, event)">Normal <span>140 ppm</span></div>
            <div class="menu-option" onclick="setReadingMode('oral', 'rápido', 170, event)">Rápido <span>170 ppm</span></div>
        </div>
        
        <div class="menu-section-title" style="margin-top: 4px;">Lectura Mental</div>
        <div class="menu-options-group">
            <div class="menu-option" onclick="setReadingMode('mental', 'lento', 180, event)">Lento <span>180 ppm</span></div>
            <div class="menu-option selected" id="opt-default" onclick="setReadingMode('mental', 'normal', 230, event)">Normal <span>230 ppm</span></div>
            <div class="menu-option" onclick="setReadingMode('mental', 'rápido', 300, event)">Rápido <span>300 ppm</span></div>
        </div>
    </div>

    <script>
        let currentWPM = 230; // Palabras por minuto por defecto (Mental Normal)
        let currentType = 'Mental';
        let currentSpeed = 'Normal';

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('text-input').focus();
            
            // Cerrar menú al hacer clic fuera o reescalar pantalla
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('reading-menu');
                const card = document.getElementById('reading-card');
                if (!card.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove('active');
                }
            });

            window.addEventListener('resize', () => {
                const menu = document.getElementById('reading-menu');
                if (menu.classList.contains('active')) {
                    positionMenu();
                }
            });
        };

        function toggleReadingMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('reading-menu');
            const isActive = menu.classList.contains('active');
            
            if (isActive) {
                menu.classList.remove('active');
            } else {
                positionMenu();
                menu.classList.add('active');
            }
        }

        function positionMenu() {
            const card = document.getElementById('reading-card');
            const menu = document.getElementById('reading-menu');
            const rect = card.getBoundingClientRect();
            
            const padding = 12;
            const menuWidth = 260;
            const menuHeight = 300;

            let top = rect.top;
            let left = rect.left - menuWidth - 10; // Posición ideal: a la izquierda de la tarjeta

            // Si no entra a la izquierda o estamos en pantalla móvil, posicionar arriba/abajo
            if (left < padding || window.innerWidth < 768) {
                left = Math.max(padding, Math.min(rect.left, window.innerWidth - menuWidth - padding));
                
                // Evaluar si cabe arriba o abajo
                if (rect.top - menuHeight - 10 > padding) {
                    top = rect.top - menuHeight - 10;
                } else {
                    top = rect.bottom + 10;
                }
            }

            // Ajustes finales de colisión con los bordes de la pantalla
            if (top + menuHeight > window.innerHeight - padding) {
                top = window.innerHeight - menuHeight - padding;
            }
            if (top < padding) {
                top = padding;
            }

            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;
        }

        function setReadingMode(type, speed, wpm, event) {
            currentWPM = wpm;
            currentType = type.charAt(0).toUpperCase() + type.slice(1);
            currentSpeed = speed.charAt(0).toUpperCase() + speed.slice(1);

            // Actualizar etiqueta
            document.getElementById('reading-mode-label').innerText = `${currentType} (${currentSpeed})`;

            // Actualizar clase seleccionada en el menú
            document.querySelectorAll('.menu-option').forEach(opt => opt.classList.remove('selected'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('selected');
            }

            // Cerrar menú y reanalizar
            document.getElementById('reading-menu').classList.remove('active');
            analyzeText();
        }

        function analyzeText() {
            const text = document.getElementById('text-input').value;

            // Procesamiento de Palabras
            const trimmed = text.trim();
            const wordCount = trimmed === "" ? 0 : (trimmed.match(/\s+/g) ? trimmed.match(/\s+/g).length + 1 : 1);
            
            // Caracteres
            const charCount = text.length;
            
            // Párrafos
            const paragraphCount = text.split(/\n+/).filter(p => p.trim().length > 0).length;
            
            // Tiempo de lectura calculado con el WPM dinámico
            const readMinutes = wordCount / currentWPM;
            let readingDisplay = "0m";

            if (readMinutes > 0 && readMinutes < 1) {
                const readSeconds = Math.ceil(readMinutes * 60);
                readingDisplay = `${readSeconds}s`;
            } else if (readMinutes >= 1) {
                readingDisplay = `${Math.ceil(readMinutes)}m`;
            }

            // Renderizado en DOM
            document.getElementById('count-words').innerText = wordCount;
            document.getElementById('count-chars').innerText = charCount;
            document.getElementById('count-paragraphs').innerText = paragraphCount;
            document.getElementById('count-reading').innerText = readingDisplay;
        }
    </script>
</body>
</html>
