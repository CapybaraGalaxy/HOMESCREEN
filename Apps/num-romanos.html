<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Conversor de Números Romanos</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-hash-icon%20lucide-hash%22%3E%3Cstyle%3E%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23000000%20!important%3B%20%7D%20%40media%20(prefers-color-scheme%3A%20dark)%20%7B%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23ffffff%20!important%3B%20%7D%20%7D%20%3C%2Fstyle%3E%3Cline%20x1%3D%224%22%20x2%3D%2220%22%20y1%3D%229%22%20y2%3D%229%22%2F%3E%3Cline%20x1%3D%224%22%20x2%3D%2220%22%20y1%3D%2215%22%20y2%3D%2215%22%2F%3E%3Cline%20x1%3D%2210%22%20x2%3D%228%22%20y1%3D%223%22%20y2%3D%2221%22%2F%3E%3Cline%20x1%3D%2216%22%20x2%3D%2214%22%20y1%3D%223%22%20y2%3D%2221%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            
            --glass: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;

            --text-main: #FFFFFF;
            --text-muted: #8E8E93;

            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --accent-primary: #0A84FF;

            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 16px) 24px;
            background: var(--bg);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                background: var(--surface);
                backdrop-filter: blur(var(--blur-val));
                -webkit-backdrop-filter: blur(var(--blur-val));
                box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 12px;
            box-sizing: border-box;
        }

        .main-content::-webkit-scrollbar {
            display: none;
        }

        .panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            transition: border-color 0.3s var(--bezier), transform 0.3s var(--spring);
        }

        .panel:focus-within {
            border-color: rgba(255,255,255,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.5rem;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s var(--bezier);
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.4;
        }

        .result-box {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            min-height: 90px;
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            line-height: 1.5;
            color: var(--text-main);
            word-break: break-word;
        }

        .result-box.placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: normal;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            border-top: 1px solid var(--glass-border);
            padding-top: 10px;
        }

        .btn {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s var(--spring), background 0.2s var(--bezier);
        }

        .btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse-num {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse-num 0.3s var(--spring);
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-view">
        <header>
            <div class="header-left">
                <div class="app-icon-badge">
                    <i data-lucide="hash" size="20" style="color: var(--text-main);"></i>
                </div>
                <h1 class="app-title">Conversor de Números Romanos</h1>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="char-count">0 dígitos</div>
        </header>

        <main class="main-content">
            <!-- Panel de Entrada -->
            <div class="panel">
                <div class="panel-header">
                    <span>Número Arábigo</span>
                    <i data-lucide="edit-3" size="16"></i>
                </div>
                <input type="text" id="number-input" placeholder="Ej. 2026" autocomplete="off" inputmode="numeric">
                <div class="panel-actions">
                    <button class="btn" onclick="clearInput()">
                        <i data-lucide="trash-2" size="14"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Panel de Resultado -->
            <div class="panel">
                <div class="panel-header">
                    <span>Número Romano</span>
                    <i data-lucide="file-text" size="16"></i>
                </div>
                <div id="result-output" class="result-box placeholder">El resultado aparecerá aquí...</div>
            </div>
        </main>
    </div>

    <script>
        const numberInput = document.getElementById('number-input');
        const resultOutput = document.getElementById('result-output');
        const charCount = document.getElementById('char-count');

        numberInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 5) val = val.slice(0, 5); // Límite práctico hasta 99999
            numberInput.value = val;
            processNumber(val);
        });

        function processNumber(str) {
            updateMeta(str.length);
            if (!str) {
                resultOutput.textContent = "El resultado aparecerá aquí...";
                resultOutput.classList.add('placeholder');
                return;
            }

            let num = parseInt(str, 10);
            resultOutput.classList.remove('placeholder');

            if (num === 0) {
                resultOutput.textContent = "Los romanos no tenían un símbolo para el cero";
                return;
            }

            if (num > 3999999) {
                resultOutput.textContent = "Número demasiado grande (máx. 3,999,999)";
                return;
            }

            try {
                let romano = toRoman(num);
                resultOutput.textContent = romano;
            } catch (err) {
                resultOutput.textContent = "Error en la conversión.";
            }
        }

        function updateMeta(len) {
            charCount.textContent = `${len} dígitos`;
            charCount.classList.add('pulse');
            setTimeout(() => charCount.classList.remove('pulse'), 300);
        }

        function clearInput() {
            numberInput.value = '';
            processNumber('');
            numberInput.focus();
        }

        function toRoman(num) {
            // Soporte estándar hasta miles con barra superior simulada o formato estándar clásico hasta 3999, 
            // extendido con notación estándar para miles si es necesario.
            const lookup = {
                M: 1000, CM: 900, D: 500, CD: 400,
                C: 100, XC: 90, L: 50, XL: 40,
                X: 10, IX: 9, V: 5, IV: 4, I: 1
            };
            let roman = '';
            for (let i in lookup) {
                while (num >= lookup[i]) {
                    roman += i;
                    num -= lookup[i];
                }
            }
            return roman;
        }

        window.onload = () => {
            lucide.createIcons();
            numberInput.value = "2026";
            numberInput.dispatchEvent(new Event('input'));
        };
    </script>
</body>
</html>
