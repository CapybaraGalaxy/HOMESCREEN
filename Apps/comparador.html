<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Comparador de Texto</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-split-icon%20lucide-split%22%3E%3Cstyle%3E%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23000000%20!important%3B%20%7D%20%40media%20(prefers-color-scheme%3A%20dark)%20%7B%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23ffffff%20!important%3B%20%7D%20%7D%20%3C%2Fstyle%3E%3Cpath%20d%3D%22M16%203h5v5%22%2F%3E%3Cpath%20d%3D%22M8%203H3v5%22%2F%3E%3Cpath%20d%3D%22M12%2022v-8.3a4%204%200%200%200-1.172-2.872L3%203%22%2F%3E%3Cpath%20d%3D%22m15%209%206-6%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Librerías auxiliares para procesamiento de PDF y Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            --glass: rgba(15, 15, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            height: 100dvh;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 16px) 24px;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
            gap: 12px;
        }

        .app-icon-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title-group h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-top: 24px;
            padding-bottom: 24px;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .workspace-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .input-box {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-box label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            resize: none;
        }

        .diff-output-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
        }

        .diff-output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .diff-output-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .diff-view {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .diff-line {
            padding: 2px 6px;
            border-radius: 4px;
            display: block;
        }

        .diff-added {
            background: rgba(52, 199, 89, 0.15);
            color: #30d158;
        }

        .diff-removed {
            background: rgba(255, 69, 58, 0.15);
            color: #ff453a;
            text-decoration: line-through;
        }

        /* Estilos añadidos para las nuevas funcionalidades */
        .controls-panel {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .checkbox-label input {
            accent-color: var(--accent-success);
            cursor: pointer;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--surface-hover);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-upload-btn {
            font-size: 11px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .file-upload-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .stats-badge-group {
            display: flex;
            gap: 8px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            font-weight: 500;
        }

        .stat-badge.added { color: #30d158; }
        .stat-badge.removed { color: #ff453a; }
        .stat-badge.modified { color: #ffd60a; }

        .diff-split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .diff-split-pane {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }

        .active-nav-diff {
            outline: 2px solid #ffd60a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="app-icon-badge">
                <i data-lucide="split" size="20" style="color: var(--text-main);"></i>
            </div>
            <div class="header-title-group">
                <h1>Comparador de Texto</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="workspace-grid">
                <div class="input-box">
                    <div class="input-header">
                        <label>Texto Original</label>
                        <label class="file-upload-btn">
                            <i data-lucide="upload" size="12"></i> Cargar archivo
                            <input type="file" hidden accept=".txt,.docx,.pdf,.csv,.json" onchange="loadFileContent(event, 'text-original')">
                        </label>
                    </div>
                    <textarea id="text-original" placeholder="Introduce o pega el texto base aquí..." oninput="executeLiveDiff()"></textarea>
                </div>
                <div class="input-box">
                    <div class="input-header">
                        <label>Texto Modificado</label>
                        <label class="file-upload-btn">
                            <i data-lucide="upload" size="12"></i> Cargar archivo
                            <input type="file" hidden accept=".txt,.docx,.pdf,.csv,.json" onchange="loadFileContent(event, 'text-modified')">
                        </label>
                    </div>
                    <textarea id="text-modified" placeholder="Introduce o pega el texto modificado aquí..." oninput="executeLiveDiff()"></textarea>
                </div>
            </div>

            <!-- Panel de Controles, Filtros y Configuración -->
            <div class="controls-panel">
                <div class="panel-section-title">🔍 Filtros de Comparación</div>
                <div class="options-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-case" onchange="executeLiveDiff()"> Ignorar Mayúsculas
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-spaces" onchange="executeLiveDiff()"> Ignorar Espacios
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-accents" onchange="executeLiveDiff()"> Ignorar Acentos
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-lines" onchange="executeLiveDiff()"> Ignorar Líneas En Blanco
                    </label>
                </div>

                <div class="panel-section-title" style="margin-top: 4px;">Modo de Vista y Exportación</div>
                <div class="options-grid" style="justify-content: space-between;">
                    <div class="btn-group">
                        <button class="btn" id="btn-view-unified" onclick="setViewMode('unified')"><i data-lucide="list" size="14"></i> Unificada</button>
                        <button class="btn" id="btn-view-split" onclick="setViewMode('split')"><i data-lucide="columns" size="14"></i> Pantalla Dividida</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn" onclick="exportDiff('diff')"><i data-lucide="download" size="14"></i> .diff</button>
                        <button class="btn" onclick="exportDiff('html')"><i data-lucide="file-code" size="14"></i> HTML</button>
                        <button class="btn" onclick="exportDiff('pdf')"><i data-lucide="file-text" size="14"></i> PDF</button>
                    </div>
                </div>
            </div>

            <div class="diff-output-card">
                <div class="diff-output-header">
                    <span class="diff-output-title">Resultado de la comparación</span>
                    
                    <div class="stats-badge-group" id="stats-panel" style="display: none;">
                        <span class="stat-badge modified" id="stat-mod">Modificaciones: 0</span>
                        <span class="stat-badge added" id="stat-add">Añadidos: 0</span>
                        <span class="stat-badge removed" id="stat-rem">Eliminados: 0</span>
                    </div>

                    <div class="btn-group" id="nav-controls" style="display: none;">
                        <button class="btn" onclick="navigateDiff(-1)"><i data-lucide="chevron-up" size="14"></i> Anterior</button>
                        <button class="btn" onclick="navigateDiff(1)"><i data-lucide="chevron-down" size="14"></i> Siguiente</button>
                    </div>
                </div>
                <div class="diff-view" id="diff-result">Las diferencias aparecerán en tiempo real a medida que escribas en los paneles superiores.</div>
            </div>
        </main>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentViewMode = 'unified';
        let diffElements = [];
        let currentDiffIndex = -1;

        function setViewMode(mode) {
            currentViewMode = mode;
            executeLiveDiff();
        }

        function normalizeText(str) {
            let res = str;
            if (document.getElementById('filter-case').checked) {
                res = res.toLowerCase();
            }
            if (document.getElementById('filter-accents').checked) {
                res = res.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            }
            if (document.getElementById('filter-spaces').checked) {
                res = res.replace(/\s+/g, '');
            }
            return res;
        }

        function executeLiveDiff() {
            const original = document.getElementById('text-original').value;
            const modified = document.getElementById('text-modified').value;
            const output = document.getElementById('diff-result');
            const statsPanel = document.getElementById('stats-panel');
            const navControls = document.getElementById('nav-controls');

            if (!original && !modified) {
                output.innerHTML = 'Las diferencias aparecerán en tiempo real a medida que escribas en los paneles superiores.';
                statsPanel.style.display = 'none';
                navControls.style.display = 'none';
                return;
            }

            const diff = computeLineDiff(original, modified);
            
            output.innerHTML = '';
            diffElements = [];
            currentDiffIndex = -1;

            if (diff.length === 0) {
                output.innerHTML = '<span style="color: var(--accent-success);">Los textos son idénticos.</span>';
                statsPanel.style.display = 'none';
                navControls.style.display = 'none';
                return;
            }

            let countAdd = 0;
            let countRem = 0;

            if (currentViewMode === 'unified') {
                diff.forEach(part => {
                    const span = document.createElement('span');
                    if (part.added) {
                        span.className = 'diff-line diff-added';
                        span.innerText = `+ ${part.value}`;
                        diffElements.push(span);
                        countAdd++;
                    } else if (part.removed) {
                        span.className = 'diff-line diff-removed';
                        span.innerText = `- ${part.value}`;
                        diffElements.push(span);
                        countRem++;
                    } else {
                        span.className = 'diff-line';
                        span.style.color = 'var(--text-main)';
                        span.innerText = `  ${part.value}`;
                    }
                    output.appendChild(span);
                });
            } else {
                const container = document.createElement('div');
                container.className = 'diff-split-container';

                const leftPane = document.createElement('div');
                leftPane.className = 'diff-split-pane';
                const rightPane = document.createElement('div');
                rightPane.className = 'diff-split-pane';

                diff.forEach(part => {
                    const leftSpan = document.createElement('span');
                    const rightSpan = document.createElement('span');
                    leftSpan.className = 'diff-line';
                    rightSpan.className = 'diff-line';

                    if (part.added) {
                        leftSpan.innerText = ' ';
                        rightSpan.className += ' diff-added';
                        rightSpan.innerText = `+ ${part.value}`;
                        diffElements.push(rightSpan);
                        countAdd++;
                    } else if (part.removed) {
                        leftSpan.className += ' diff-removed';
                        leftSpan.innerText = `- ${part.value}`;
                        rightSpan.innerText = ' ';
                        diffElements.push(leftSpan);
                        countRem++;
                    } else {
                        leftSpan.style.color = 'var(--text-main)';
                        rightSpan.style.color = 'var(--text-main)';
                        leftSpan.innerText = `  ${part.value}`;
                        rightSpan.innerText = `  ${part.value}`;
                    }

                    leftPane.appendChild(leftSpan);
                    rightPane.appendChild(rightSpan);
                });

                container.appendChild(leftPane);
                container.appendChild(rightPane);
                output.appendChild(container);
            }

            // Actualizar Estadísticas
            document.getElementById('stat-add').innerText = `Añadidos: ${countAdd}`;
            document.getElementById('stat-rem').innerText = `Eliminados: ${countRem}`;
            document.getElementById('stat-mod').innerText = `Modificaciones: ${countAdd + countRem}`;
            
            statsPanel.style.display = 'flex';
            navControls.style.display = diffElements.length > 0 ? 'flex' : 'none';
        }

        function computeLineDiff(oldStr, newStr) {
            let oldLines = oldStr.split('\n');
            let newLines = newStr.split('\n');

            if (document.getElementById('filter-lines').checked) {
                oldLines = oldLines.filter(l => l.trim() !== '');
                newLines = newLines.filter(l => l.trim() !== '');
            }

            let result = [];
            let i = 0, j = 0;

            while (i < oldLines.length || j < newLines.length) {
                let match = false;
                if (i < oldLines.length && j < newLines.length) {
                    const normOld = normalizeText(oldLines[i]);
                    const normNew = normalizeText(newLines[j]);
                    if (normOld === normNew) {
                        match = true;
                    }
                }

                if (match) {
                    result.push({ value: oldLines[i], added: false, removed: false });
                    i++;
                    j++;
                } else if (j < newLines.length && (i >= oldLines.length || oldLines.slice(i).findIndex(l => normalizeText(l) === normalizeText(newLines[j])) === -1)) {
                    result.push({ value: newLines[j], added: true, removed: false });
                    j++;
                } else {
                    result.push({ value: oldLines[i], added: false, removed: true });
                    i++;
                }
            }
            
            if (oldStr === newStr && !document.getElementById('filter-case').checked && !document.getElementById('filter-accents').checked && !document.getElementById('filter-spaces').checked && !document.getElementById('filter-lines').checked) return [];
            
            return result;
        }

        function navigateDiff(direction) {
            if (diffElements.length === 0) return;

            if (currentDiffIndex >= 0 && currentDiffIndex < diffElements.length) {
                diffElements[currentDiffIndex].classList.remove('active-nav-diff');
            }

            currentDiffIndex += direction;
            if (currentDiffIndex < 0) currentDiffIndex = diffElements.length - 1;
            if (currentDiffIndex >= diffElements.length) currentDiffIndex = 0;

            const target = diffElements[currentDiffIndex];
            target.classList.add('active-nav-diff');
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function loadFileContent(event, targetId) {
            const file = event.target.files[0];
            if (!file) return;

            const target = document.getElementById(targetId);
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'txt' || ext === 'csv' || ext === 'json') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    target.value = e.target.result;
                    executeLiveDiff();
                };
                reader.readAsText(file);
            } else if (ext === 'docx') {
                const arrayBuffer = await file.arrayBuffer();
                const res = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                target.value = res.value;
                executeLiveDiff();
            } else if (ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const strings = content.items.map(item => item.str);
                    text += strings.join(' ') + '\n';
                }
                target.value = text;
                executeLiveDiff();
            }
        }

        function exportDiff(format) {
            const original = document.getElementById('text-original').value;
            const modified = document.getElementById('text-modified').value;
            const diff = computeLineDiff(original, modified);

            if (format === 'diff') {
                let text = '--- Original\n+++ Modificado\n';
                diff.forEach(d => {
                    if (d.added) text += `+ ${d.value}\n`;
                    else if (d.removed) text += `- ${d.value}\n`;
                    else text += `  ${d.value}\n`;
                });
                downloadFile(text, 'diferencias.diff', 'text/plain');
            } else if (format === 'html') {
                const htmlContent = `<!DOCTYPE html><html><head><title>Reporte de Diferencias</title><style>body{font-family:sans-serif;background:#121212;color:#fff;padding:20px;}.diff-added{color:#30d158;background:rgba(52,199,89,0.15);}.diff-removed{color:#ff453a;background:rgba(255,69,58,0.15);text-decoration:line-through;}pre{padding:4px;}</style></head><body><h2>Reporte de Diferencias</h2><pre>${document.getElementById('diff-result').innerHTML}</pre></body></html>`;
                downloadFile(htmlContent, 'reporte.html', 'text/html');
            } else if (format === 'pdf') {
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`<html><head><title>Reporte de Diferencias</title><style>body{font-family:sans-serif;padding:20px;}.diff-added{color:green;}.diff-removed{color:red;text-decoration:line-through;}pre{white-space:pre-wrap;}</style></head><body><h2>Reporte de Diferencias</h2><pre>${document.getElementById('diff-result').innerText}</pre></body></html>`);
                printWindow.document.close();
                printWindow.print();
            }
        }

        function downloadFile(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        // Inicializar iconos de Lucide de forma nativa
        lucide.createIcons();
    </script>
</body>
</html>
