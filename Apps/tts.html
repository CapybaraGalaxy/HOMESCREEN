<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lector de Texto a Voz</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-speech-icon%20lucide-speech%22%3E%3Cstyle%3E%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23000000%20!important%3B%20%7D%20%40media%20(prefers-color-scheme%3A%20dark)%20%7B%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23ffffff%20!important%3B%20%7D%20%7D%20%3C%2Fstyle%3E%3Cpath%20d%3D%22M8.8%2020v-4.1l1.9.2a2.3%202.3%200%200%200%202.164-2.1V8.3A5.37%205.37%200%200%200%202%208.25c0%202.8.656%203.054%201%204.55a5.77%205.77%200%200%201%20.029%202.758L2%2020%22%2F%3E%3Cpath%20d%3D%22M19.8%2017.8a7.5%207.5%200%200%200%20.003-10.603%22%2F%3E%3Cpath%20d%3D%22M17%2015a3.5%203.5%200%200%200-.025-4.975%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            
            --glass: rgba(15, 15, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-val: 30px;

            --text-main: #FFFFFF;
            --text-muted: #8E8E93;

            --accent-danger: #FF453A;
            --accent-success: #34C759;
            --accent-primary: #0A84FF;

            --bezier: cubic-bezier(0.16, 1, 0.3, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 24px calc(env(safe-area-inset-bottom) + 16px) 24px;
            background: var(--bg);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                height: 90vh;
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                background: var(--surface);
                backdrop-filter: blur(var(--blur-val));
                -webkit-backdrop-filter: blur(var(--blur-val));
                box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 4px 0;
            box-sizing: border-box;
        }

        .main-content::-webkit-scrollbar {
            display: none;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .converter-grid {
                grid-template-columns: 1.2fr 0.8fr;
            }
        }

        .panel {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            transition: border-color 0.3s var(--bezier);
        }

        .panel:focus-within {
            border-color: rgba(255,255,255,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
            min-height: 180px;
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s var(--bezier);
        }

        select:focus {
            border-color: var(--accent-primary);
        }

        select option {
            background: var(--surface);
            color: var(--text-main);
        }

        .range-value {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .panel-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--glass-border);
            padding-top: 10px;
            margin-top: auto;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s var(--spring), background 0.2s var(--bezier);
        }

        .btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--accent-primary);
            border-color: transparent;
        }

        .btn-primary:hover {
            background: #0071e3;
        }

        .btn-danger {
            background: rgba(255, 69, 58, 0.15);
            color: var(--accent-danger);
            border-color: rgba(255, 69, 58, 0.3);
        }

        @keyframes pulse-val {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse-val 0.3s var(--spring);
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-view">
        <header>
            <div class="header-left">
                <div class="app-icon-badge">
                    <i data-lucide="speech" size="20" style="color: var(--text-main);"></i>
                </div>
                <h1 class="app-title">Lector de Texto a Voz</h1>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);" id="char-count">0 caracteres</div>
        </header>

        <main class="main-content">
            <div class="converter-grid">
                <!-- Panel de Texto -->
                <div class="panel">
                    <div class="panel-header">
                        <span>Texto a Reproducir</span>
                        <i data-lucide="file-text" size="16"></i>
                    </div>
                    <textarea id="text-input" placeholder="Escribe o pega texto aquí para sintetizar voz..."></textarea>
                    <div class="panel-actions">
                        <button class="btn" onclick="clearText()">
                            <i data-lucide="trash-2" size="14"></i> Limpiar
                        </button>
                        <div class="btn-group">
                            <button class="btn btn-danger" id="stop-btn" onclick="stopSpeech()">
                                <i data-lucide="square" size="14"></i> Detener
                            </button>
                            <button class="btn btn-primary" id="play-btn" onclick="toggleSpeech()">
                                <i data-lucide="play" size="14"></i> Reproducir
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Panel de Configuración de Voces -->
                <div class="panel">
                    <div class="panel-header">
                        <span>Opciones de Voz</span>
                        <i data-lucide="sliders" size="16"></i>
                    </div>

                    <div class="control-group">
                        <label for="voice-select">Voz del Sistema</label>
                        <select id="voice-select">
                            <option value="">Cargando voces...</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="rate-range">Velocidad</label>
                        <input type="range" id="rate-range" min="0.5" max="2" step="0.1" value="1">
                        <div class="range-value"><span>0.5x</span><span id="rate-val">1.0x</span><span>2.0x</span></div>
                    </div>

                    <div class="control-group">
                        <label for="pitch-range">Tono</label>
                        <input type="range" id="pitch-range" min="0.5" max="1.5" step="0.1" value="1">
                        <div class="range-value"><span>Grave</span><span id="pitch-val">1.0</span><span>Agudo</span></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateRange = document.getElementById('rate-range');
        const pitchRange = document.getElementById('pitch-range');
        const rateVal = document.getElementById('rate-val');
        const pitchVal = document.getElementById('pitch-val');
        const charCount = document.getElementById('char-count');
        const playBtn = document.getElementById('play-btn');

        let synth = window.speechSynthesis;
        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            if (voices.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = "No hay voces disponibles";
                voiceSelect.appendChild(opt);
                return;
            }

            // Ordenar para priorizar el idioma español si existe
            voices.sort((a, b) => {
                const aEs = a.lang.startsWith('es') ? -1 : 1;
                const bEs = b.lang.startsWith('es') ? -1 : 1;
                return aEs - bEs;
            });

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.default) {
                    option.textContent += ' — Predeterminada';
                }
                voiceSelect.appendChild(option);
            });
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        textInput.addEventListener('input', () => {
            const len = textInput.value.length;
            charCount.textContent = `${len} caracteres`;
            charCount.classList.add('pulse');
            setTimeout(() => charCount.classList.remove('pulse'), 300);
        });

        rateRange.addEventListener('input', () => {
            rateVal.textContent = `${rateRange.value}x`;
        });

        pitchRange.addEventListener('input', () => {
            pitchVal.textContent = pitchRange.value;
        });

        function toggleSpeech() {
            if (synth.speaking) {
                synth.cancel();
                playBtn.innerHTML = '<i data-lucide="play" size="14"></i> Reproducir';
                lucide.createIcons();
                return;
            }

            const text = textInput.value.trim();
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = voiceSelect.value;
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            utterance.rate = parseFloat(rateRange.value);
            utterance.pitch = parseFloat(pitchRange.value);

            utterance.onstart = () => {
                playBtn.innerHTML = '<i data-lucide="pause" size="14"></i> Pausar';
                lucide.createIcons();
            };

            utterance.onend = () => {
                playBtn.innerHTML = '<i data-lucide="play" size="14"></i> Reproducir';
                lucide.createIcons();
            };

            utterance.onerror = () => {
                playBtn.innerHTML = '<i data-lucide="play" size="14"></i> Reproducir';
                lucide.createIcons();
            };

            synth.speak(utterance);
        }

        function stopSpeech() {
            if (synth.speaking || synth.paused) {
                synth.cancel();
                playBtn.innerHTML = '<i data-lucide="play" size="14"></i> Reproducir';
                lucide.createIcons();
            }
        }

        function clearText() {
            stopSpeech();
            textInput.value = '';
            charCount.textContent = '0 caracteres';
            textInput.focus();
        }

        window.onload = () => {
            lucide.createIcons();
            loadVoices();
            textInput.value = "Hola, esta es una aplicación de texto a voz optimizada con todas las voces disponibles en tu navegador.";
            textInput.dispatchEvent(new Event('input'));
        };
    </script>
</body>
</html>
