<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pizarra de Bocetos</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22currentColor%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22lucide%20lucide-pencil-line-icon%20lucide-pencil-line%22%3E%3Cstyle%3E%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23000000%20!important%3B%20%7D%20%40media%20(prefers-color-scheme%3A%20dark)%20%7B%20path%2C%20circle%2C%20rect%2C%20polygon%2C%20line%2C%20polyline%2C%20ellipse%20%7B%20stroke%3A%20%23ffffff%20!important%3B%20%7D%20%7D%20%3C%2Fstyle%3E%3Cpath%20d%3D%22M13%2021h8%22%2F%3E%3Cpath%20d%3D%22m15%205%204%204%22%2F%3E%3Cpath%20d%3D%22M21.174%206.812a1%201%200%200%200-3.986-3.987L3.842%2016.174a2%202%200%200%200-.5.83l-1.321%204.352a.5.5%200%200%200%20.623.622l4.353-1.32a2%202%200%200%200%20.83-.497z%22%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root[data-theme="dark"] {
            --bg: #000000;
            --surface: #121212;
            --surface-hover: #1c1c1e;
            --glass: rgba(15, 15, 15, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --accent-active: #0A84FF;
        }

        :root[data-theme="light"] {
            --bg: #F5F5F7;
            --surface: #FFFFFF;
            --surface-hover: #E5E5EA;
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --accent-active: #0071E3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            touch-action: none;
        }

        .app-container {
            max-width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px) 12px;
            position: relative;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
            z-index: 20;
            background: var(--bg);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: radial-gradient(circle, rgba(10,132,255,0.15) 0%, rgba(18,18,18,0.8) 100%);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .app-counter {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .header-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-btn:hover {
            background: var(--surface-hover);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-btn.active {
            background: var(--accent-active);
            color: #FFFFFF;
            border-color: transparent;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-top: 8px;
            gap: 8px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
            align-items: center;
            z-index: 20;
            justify-content: center;
        }

        .tool-group {
            display: flex;
            gap: 4px;
            background: var(--surface);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .tool-flyout {
            position: absolute;
            top: 55px;
            left: 10px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 240px;
        }

        .tool-flyout.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .flyout-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .flyout-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .color-dot.active {
            transform: scale(1.15);
            border-color: var(--text-main);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        .custom-color-picker {
            width: 100%;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: none;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        .custom-color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .custom-color-picker::-webkit-color-swatch { border: 1px solid var(--glass-border); border-radius: 8px; }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent-active);
            cursor: pointer;
        }

        .slider-value {
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            min-width: 38px;
            text-align: right;
            color: var(--text-muted);
        }

        .canvas-wrapper {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            touch-action: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .cursor-draw { cursor: crosshair; }
        .cursor-select { cursor: default; }
        .cursor-pan { cursor: grab; }
        .cursor-panning { cursor: grabbing !important; }
        .cursor-resize-nwse { cursor: nwse-resize; }
        .cursor-resize-nesw { cursor: nesw-resize; }

        .zoom-indicator {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 10;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            margin-bottom: 16px;
            font-family: 'Outfit', sans-serif;
        }

        .modal-input:focus { border-color: var(--accent-active); }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn {
            background: var(--surface-hover);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn.primary {
            background: var(--accent-active);
            color: #FFFFFF;
            border-color: transparent;
        }

        .btn:hover { opacity: 0.9; }

        .error-shake {
            animation: shake 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-color: #FF453A !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-view">
        <header>
            <div class="header-left">
                <div class="app-icon-badge">
                    <i data-lucide="pencil-line" size="18" style="color: var(--accent-active);"></i>
                </div>
                <div>
                    <h1 class="app-title">Bocetos</h1>
                    <span class="app-counter" id="element-count">0 elementos</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-undo" title="Deshacer (Ctrl+Z)"><i data-lucide="rotate-ccw" size="15"></i></button>
                <button class="icon-btn" id="btn-redo" title="Rehacer (Ctrl+Y)"><i data-lucide="rotate-cw" size="15"></i></button>
                <button class="icon-btn" id="btn-theme" title="Cambiar Tema"><i data-lucide="sun-medium" size="15"></i></button>
                <button class="icon-btn" id="btn-pattern" title="Patrón de Fondo"><i data-lucide="layout-grid" size="15"></i></button>
                <button class="icon-btn" id="btn-copy" title="Copiar"><i data-lucide="copy" size="15"></i></button>
                <button class="icon-btn" id="btn-export" title="Exportar PNG"><i data-lucide="image" size="15"></i></button>
                <button class="icon-btn" id="btn-storage" title="Guardar / Cargar JSON"><i data-lucide="save" size="15"></i></button>
                <button class="icon-btn" id="btn-clear-all" title="Borrar Todo" style="color: #FF453A;"><i data-lucide="trash-2" size="15"></i></button>
            </div>
        </header>

        <main class="main-content">
            <div class="toolbar" id="toolbar">
                <div class="tool-group">
                    <button class="icon-btn tool-select active" data-tool="pencil" title="Lápiz"><i data-lucide="pencil" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="eraser" title="Goma de Borrar"><i data-lucide="eraser" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="fill" title="Cubo de Pintura"><i data-lucide="paint-bucket" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="eyedropper" title="Cuentagotas"><i data-lucide="pipette" size="15"></i></button>
                </div>
                <div class="tool-group">
                    <button class="icon-btn tool-select" data-tool="line" title="Línea"><i data-lucide="slash" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="rectangle" title="Rectángulo"><i data-lucide="square" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="circle" title="Círculo"><i data-lucide="circle" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="arrow" title="Flecha"><i data-lucide="arrow-up-right" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="star" title="Estrella"><i data-lucide="star" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="text" title="Texto"><i data-lucide="type" size="15"></i></button>
                </div>
                <div class="tool-group">
                    <button class="icon-btn tool-select" data-tool="select" title="Seleccionar/Mover"><i data-lucide="mouse-pointer" size="15"></i></button>
                    <button class="icon-btn tool-select" data-tool="pan" title="Mover Lienzo"><i data-lucide="hand" size="15"></i></button>
                    <button class="icon-btn" id="btn-duplicate" title="Duplicar"><i data-lucide="copy-plus" size="15"></i></button>
                    <button class="icon-btn" id="btn-delete" title="Eliminar"><i data-lucide="trash-2" size="15"></i></button>
                    <label class="icon-btn" title="Importar Imagen" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        <i data-lucide="image-plus" size="15"></i>
                        <input type="file" id="image-loader" accept="image/*" style="display: none;">
                    </label>
                </div>
            </div>

            <div class="tool-flyout" id="tool-flyout">
                <div class="flyout-section">
                    <span class="flyout-label">Color</span>
                    <div class="color-grid" id="flyout-colors">
                        <div class="color-dot active" style="background: #FFFFFF;" data-color="#FFFFFF"></div>
                        <div class="color-dot" style="background: #000000;" data-color="#000000"></div>
                        <div class="color-dot" style="background: #0A84FF;" data-color="#0A84FF"></div>
                        <div class="color-dot" style="background: #34C759;" data-color="#34C759"></div>
                        <div class="color-dot" style="background: #FF9F0A;" data-color="#FF9F0A"></div>
                        <div class="color-dot" style="background: #FF453A;" data-color="#FF453A"></div>
                        <div class="color-dot" style="background: #BF5AF2;" data-color="#BF5AF2"></div>
                        <div class="color-dot" style="background: #5856D6;" data-color="#5856D6"></div>
                        <div class="color-dot" style="background: #64D2FF;" data-color="#64D2FF"></div>
                        <div class="color-dot" style="background: #FFD60A;" data-color="#FFD60A"></div>
                        <div class="color-dot" style="background: #AC8E68;" data-color="#AC8E68"></div>
                        <div class="color-dot" style="background: #8E8E93;" data-color="#8E8E93"></div>
                    </div>
                    <input type="color" id="custom-color-picker" class="custom-color-picker" title="Color personalizado">
                </div>
                <div class="flyout-section">
                    <span class="flyout-label">Grosor de Trazo</span>
                    <div class="slider-row">
                        <input type="range" id="flyout-size" min="1" max="50" value="3">
                        <span class="slider-value" id="size-val">3px</span>
                    </div>
                </div>
                <div class="flyout-section">
                    <span class="flyout-label">Opacidad</span>
                    <div class="slider-row">
                        <input type="range" id="flyout-opacity" min="0.1" max="1" step="0.05" value="1">
                        <span class="slider-value" id="opacity-val">100%</span>
                    </div>
                </div>
            </div>

            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="sketch-canvas" class="cursor-draw"></canvas>
                <div class="zoom-indicator" id="zoom-indicator">100%</div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="text-modal">
        <div class="modal-card">
            <h3 class="modal-title">Añadir Texto</h3>
            <input type="text" class="modal-input" id="text-input" placeholder="Escribe tu texto..." autocomplete="off">
            <div class="modal-buttons">
                <button class="btn" id="text-cancel">Cancelar</button>
                <button class="btn primary" id="text-confirm">Añadir</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="storage-modal">
        <div class="modal-card">
            <h3 class="modal-title">Gestión de Proyecto</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn primary" id="modal-download" title="Descargar archivo .json"><i data-lucide="download" size="16"></i> Descargar Proyecto</button>
                <label class="btn" title="Cargar archivo .json" style="cursor: pointer;">
                    <i data-lucide="upload" size="16"></i> Cargar Proyecto
                    <input type="file" id="json-loader" accept=".json" style="display: none;">
                </label>
                <button class="btn" id="modal-save">Guardar en Navegador (Local)</button>
                <button class="btn" id="modal-load">Cargar del Navegador</button>
                <button class="btn" id="modal-clear" style="color: #FF453A;"><i data-lucide="trash" size="16"></i> Borrar Lienzo</button>
            </div>
            <div class="modal-buttons">
                <button class="btn" id="storage-close">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let appData = {
            elements: [], undoStack: [], redoStack: [],
            tool: 'pencil', color: '#0A84FF', lineWidth: 3, opacity: 1.0,
            panX: 0, panY: 0, zoom: 1, theme: 'dark', bgPattern: 'grid'
        };

        let isDrawing = false, isPanning = false, isDragging = false;
        let startX = 0, startY = 0, dragOffsetX = 0, dragOffsetY = 0;
        let currentElement = null, selectedIndex = -1, activeResizeHandle = null; 
        let appDataResizeOriginal = null; // Guardará estado original para resizear sin errores
        let textModalResolve = null;

        const canvas = document.getElementById('sketch-canvas');
        // FIX 1: willReadFrequently true optimiza leer pixeles para el color picker y fill tool
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const flyout = document.getElementById('tool-flyout');

        function initApp() {
            lucide.createIcons();
            loadState();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupListeners();
            updateCursor();
            renderApp();
        }

        function resizeCanvas() {
            const rect = canvasWrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            renderApp();
        }

        function pushState() {
            appData.undoStack.push(JSON.parse(JSON.stringify(appData.elements)));
            appData.redoStack = [];
            if (appData.undoStack.length > 50) appData.undoStack.shift();
            saveAuto();
        }

        function saveAuto() {
            try {
                const cleanElements = appData.elements.map(el => {
                    const clone = {...el}; delete clone.imgObj; return clone;
                });
                localStorage.setItem('neo_sketch_pro_data', JSON.stringify(cleanElements));
            } catch(e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('neo_sketch_pro_data');
                if (saved) restoreData(JSON.parse(saved));
            } catch(e) {}
        }

        function restoreData(elements) {
            appData.elements = elements;
            appData.elements.forEach(el => {
                if (el.type === 'image' && el.src) {
                    const img = new Image();
                    img.onload = () => { el.imgObj = img; renderApp(); };
                    img.src = el.src;
                }
            });
            selectedIndex = -1;
            renderApp();
        }

        function updateCursor() {
            canvas.className = '';
            if (appData.tool === 'pan') canvas.classList.add('cursor-pan');
            else if (appData.tool === 'select') canvas.classList.add('cursor-select');
            else canvas.classList.add('cursor-draw');
        }

        function renderApp() {
            const dpr = window.devicePixelRatio || 1;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.scale(dpr, dpr);

            const width = canvas.width / dpr;
            const height = canvas.height / dpr;

            drawBackgroundPattern(width, height);

            ctx.save();
            ctx.translate(appData.panX, appData.panY);
            ctx.scale(appData.zoom, appData.zoom);

            appData.elements.forEach((el, index) => drawElement(el, index === selectedIndex));
            if (currentElement) drawElement(currentElement, false);

            ctx.restore();
            ctx.restore();

            document.getElementById('element-count').textContent = `${appData.elements.length} elementos`;
            document.getElementById('zoom-indicator').textContent = `${Math.round(appData.zoom * 100)}%`;
        }

        function drawBackgroundPattern(w, h, forExport = false) {
            ctx.save();
            const isDark = appData.theme === 'dark';
            ctx.fillStyle = forExport 
                ? (isDark ? '#000000' : '#FFFFFF') 
                : (isDark ? '#121212' : '#FFFFFF');
            ctx.fillRect(0, 0, w, h);

            if (appData.bgPattern === 'blank') { ctx.restore(); return; }

            const step = 40 * appData.zoom;
            const offsetX = forExport ? 0 : (appData.panX % step);
            const offsetY = forExport ? 0 : (appData.panY % step);

            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;

            if (appData.bgPattern === 'grid') {
                for (let x = offsetX; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
                for (let y = offsetY; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
            } else if (appData.bgPattern === 'dots') {
                for (let x = offsetX; x < w; x += step) {
                    for (let y = offsetY; y < h; y += step) {
                        ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        function drawElement(el, isSelected) {
            ctx.save();
            ctx.strokeStyle = el.color || '#0A84FF';
            ctx.fillStyle = el.color || '#0A84FF';
            ctx.lineWidth = el.lineWidth || 3;
            ctx.globalAlpha = el.opacity !== undefined ? el.opacity : 1.0;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (el.type === 'pencil' && el.points && el.points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(el.points[0].x, el.points[0].y);
                for (let i = 1; i < el.points.length - 2; i++) {
                    let xc = (el.points[i].x + el.points[i + 1].x) / 2;
                    let yc = (el.points[i].y + el.points[i + 1].y) / 2;
                    ctx.quadraticCurveTo(el.points[i].x, el.points[i].y, xc, yc);
                }
                if (el.points.length > 2) {
                    let last = el.points.length - 1;
                    ctx.quadraticCurveTo(el.points[last - 1].x, el.points[last - 1].y, el.points[last].x, el.points[last].y);
                }
                ctx.stroke();
            } else if (el.type === 'line') {
                ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
            } else if (el.type === 'rectangle') {
                if (el.fillColor) { ctx.fillStyle = el.fillColor; ctx.fillRect(el.x, el.y, el.w, el.h); }
                ctx.strokeRect(el.x, el.y, el.w, el.h);
            } else if (el.type === 'circle') {
                ctx.beginPath();
                let rx = Math.abs(el.w) / 2, ry = Math.abs(el.h) / 2;
                ctx.ellipse(el.x + rx, el.y + ry, rx, ry, 0, 0, Math.PI * 2);
                if (el.fillColor) { ctx.fillStyle = el.fillColor; ctx.fill(); }
                ctx.stroke();
            } else if (el.type === 'arrow') { drawArrowShape(el.x1, el.y1, el.x2, el.y2);
            } else if (el.type === 'star') { drawStarShape(el.x, el.y, el.w, el.h);
            } else if (el.type === 'text') {
                ctx.font = `${el.fontSize || 28}px Outfit, sans-serif`;
                ctx.fillText(el.text, el.x, el.y);
            } else if (el.type === 'image') {
                if (el.imgObj && el.imgObj.complete) ctx.drawImage(el.imgObj, el.x, el.y, el.w, el.h);
                else if (el.src && !el.imgObj) {
                    const img = new Image();
                    img.onload = () => { el.imgObj = img; renderApp(); };
                    img.src = el.src;
                }
            }

            if (isSelected) drawSelectionBox(el);
            ctx.restore();
        }

        function drawSelectionBox(el) {
            ctx.strokeStyle = '#0A84FF';
            // FIX: Dividimos los tamaños por el zoom para que siempre se vean igual en pantalla
            let z = appData.zoom;
            ctx.lineWidth = 1.5 / z;
            ctx.setLineDash([6 / z, 6 / z]);
            ctx.globalAlpha = 1.0;
            
            let bbox = getElementBBox(el);
            let p = 8 / z; // padding responsivo al zoom
            ctx.strokeRect(bbox.x - p, bbox.y - p, bbox.w + p * 2, bbox.h + p * 2);
            
            ctx.setLineDash([]);
            ctx.fillStyle = '#0A84FF';
            getResizeHandles(bbox).forEach(h => {
                ctx.beginPath(); ctx.arc(h.x, h.y, 7 / z, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2 / z; ctx.stroke();
            });
        }

        function drawArrowShape(x1, y1, x2, y2) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const headLen = 18;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(x2, y2);
            ctx.fillStyle = ctx.strokeStyle; ctx.fill();
        }

        function drawStarShape(x, y, w, h) {
            ctx.beginPath();
            let cx = x + w / 2, cy = y + h / 2;
            let outer = Math.abs(w) / 2, inner = outer / 2, spikes = 5, rot = Math.PI / 2 * 3, step = Math.PI / spikes;
            ctx.moveTo(cx, cy - outer);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer); rot += step;
                ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner); rot += step;
            }
            ctx.lineTo(cx, cy - outer); ctx.closePath(); ctx.stroke();
        }

        function getElementBBox(el) {
            if (el.type === 'pencil') {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                el.points.forEach(p => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });
                return { x: minX, y: minY, w: maxX - minX || 10, h: maxY - minY || 10 };
            } else if (el.type === 'line' || el.type === 'arrow') {
                return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1) || 10, h: Math.abs(el.y2 - el.y1) || 10 };
            } else if (['rectangle', 'circle', 'star', 'image'].includes(el.type)) {
                return { x: el.w < 0 ? el.x + el.w : el.x, y: el.h < 0 ? el.y + el.h : el.y, w: Math.abs(el.w) || 20, h: Math.abs(el.h) || 20 };
            } else if (el.type === 'text') {
                ctx.font = `${el.fontSize || 28}px Outfit, sans-serif`;
                return { x: el.x, y: el.y - 24, w: ctx.measureText(el.text).width || 50, h: 32 };
            }
            return { x: 0, y: 0, w: 20, h: 20 };
        }

        function getResizeHandles(bbox) {
            let p = 8 / appData.zoom;
            return [
                { id: 'tl', x: bbox.x - p, y: bbox.y - p }, { id: 'tr', x: bbox.x + bbox.w + p, y: bbox.y - p },
                { id: 'bl', x: bbox.x - p, y: bbox.y + bbox.h + p }, { id: 'br', x: bbox.x + bbox.w + p, y: bbox.y + bbox.h + p }
            ];
        }

        function screenToCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return { x: (clientX - rect.left - appData.panX) / appData.zoom, y: (clientY - rect.top - appData.panY) / appData.zoom };
        }

        async function promptTextModal() {
            return new Promise((resolve) => {
                document.getElementById('text-modal').classList.add('active');

        }

                if (selectedIndex !== -1) { appData.elements[selectedIndex].opacity = appData.opacity; pushState(); renderApp(); }

            canvas.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                const newZoom = Math.min(Math.max(appData.zoom * zoomFactor, 0.2), 5);
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
                appData.panX = mouseX - (mouseX - appData.panX) * (newZoom / appData.zoom);
                appData.panY = mouseY - (mouseY - appData.panY) * (newZoom / appData.zoom);
                appData.zoom = newZoom;

            document.getElementById('btn-pattern').addEventListener('click', () => {

                eCtx.save();
                const isDark = appData.theme === 'dark';
                eCtx.fillStyle = isDark ? '#121212' : '#FFFFFF';
                eCtx.fillRect(0, 0, w, h);

            // Storage & Borrar Todo

            document.getElementById('storage-close').addEventListener('click', () => document.getElementById('storage-modal').classList.remove('active'));
            
            // Función genérica para borrar todo

            document.getElementById('modal-load').addEventListener('click', () => { loadState(); document.getElementById('storage-modal').classList.remove('active'); });
            
            document.getElementById('modal-download').addEventListener('click', () => {
                const cleanData = appData.elements.map(el => { const c = {...el}; delete c.imgObj; return c; });
                const blob = new Blob([JSON.stringify(cleanData)], { type: 'application/json' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'proyecto_bocetos.json'; link.click();
            });
            document.getElementById('json-loader').addEventListener('change', (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (event) => { restoreData(JSON.parse(event.target.result)); document.getElementById('storage-modal').classList.remove('active'); };
                reader.readAsText(file);
            });

            document.getElementById('btn-duplicate').addEventListener('click', () => {
                if (selectedIndex !== -1) {
                    pushState();
                    let clone = JSON.parse(JSON.stringify(appData.elements[selectedIndex]));
                    if (clone.type === 'image' && appData.elements[selectedIndex].imgObj) clone.imgObj = appData.elements[selectedIndex].imgObj;
                    if (clone.x !== undefined) { clone.x += 20; clone.y += 20; }
                    if (clone.x1 !== undefined) { clone.x1 += 20; clone.x2 += 20; clone.y1 += 20; clone.y2 += 20; }
                    appData.elements.push(clone); selectedIndex = appData.elements.length - 1; renderApp();
                }

            document.getElementById('btn-delete').addEventListener('click', () => {
                if (selectedIndex !== -1) { pushState(); appData.elements.splice(selectedIndex, 1); selectedIndex = -1; renderApp(); }

            document.getElementById('image-loader').addEventListener('change', (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        pushState();
                        let maxD = 300, w = img.width, h = img.height;
                        if (w > maxD || h > maxD) { if (w > h) { h = (h/w)*maxD; w=maxD; } else { w = (w/h)*maxD; h=maxD; } }
                        appData.elements.push({ type: 'image', src: ev.target.result, imgObj: img, x: -appData.panX/appData.zoom + 100, y: -appData.panY/appData.zoom + 100, w: w, h: h, opacity: 1.0 });
                        renderApp();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('text-confirm').addEventListener('click', () => {
                const input = document.getElementById('text-input');
                if (!input.value.trim()) { input.classList.add('error-shake'); setTimeout(() => input.classList.remove('error-shake'), 300); return; }
                document.getElementById('text-modal').classList.remove('active');
                if (textModalResolve) textModalResolve(input.value);
            });
            document.getElementById('text-cancel').addEventListener('click', () => { document.getElementById('text-modal').classList.remove('active'); if (textModalResolve) textModalResolve(null); });

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoAction(); }
                if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redoAction(); }
                if (e.key === 'Delete' || e.key === 'Backspace') document.getElementById('btn-delete').click();
            });
        }

        function toggleFlyout(btn) {
            const rect = btn.getBoundingClientRect();
            flyout.style.left = `${Math.max(10, rect.left - 40)}px`;
            flyout.classList.toggle('active');
        }

        function undoAction() {
            if (appData.undoStack.length > 0) {
                appData.redoStack.push(JSON.parse(JSON.stringify(appData.elements)));
                appData.elements = appData.undoStack.pop();
                selectedIndex = -1; renderApp(); saveAuto();
            }
        }
        function redoAction() {
            if (appData.redoStack.length > 0) {
                appData.undoStack.push(JSON.parse(JSON.stringify(appData.elements)));
                appData.elements = appData.redoStack.pop();
                selectedIndex = -1; renderApp(); saveAuto();
            }
        }

        // HELPERS PARA EL FILL TIPO PAINT
        function hexToRgba(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b, 255];
        }

        function performFloodFill(clientX, clientY, fillColorHex) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            const startX = Math.floor((clientX - rect.left) * dpr);
            const startY = Math.floor((clientY - rect.top) * dpr);

            // Leemos los pixeles de la pantalla
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const w = canvas.width;
            const h = canvas.height;

            const startPos = (startY * w + startX) * 4;
            const startR = data[startPos];
            const startG = data[startPos+1];
            const startB = data[startPos+2];
            const startA = data[startPos+3];

            const fillColor = hexToRgba(fillColorHex);
            if (startR === fillColor[0] && startG === fillColor[1] && startB === fillColor[2] && startA === fillColor[3]) return;

            // Creamos una copia en blanco solo para los píxeles nuevos (capa transparente)
            const newImageData = new ImageData(w, h);
            const newData = newImageData.data;

            const pixelStack = [[startX, startY]];

            const matchStartColor = (pos) => {
                return data[pos] === startR && data[pos+1] === startG && data[pos+2] === startB && data[pos+3] === startA;
            };

            const colorPixel = (pos) => {
                newData[pos] = fillColor[0]; newData[pos+1] = fillColor[1];
                newData[pos+2] = fillColor[2]; newData[pos+3] = 255;
                data[pos] = fillColor[0]; data[pos+1] = fillColor[1];
                data[pos+2] = fillColor[2]; data[pos+3] = 255; // Marcar como visitado
            };

            while (pixelStack.length) {
                let newPos = pixelStack.pop();
                let x = newPos[0], y = newPos[1];
                let pixelPos = (y * w + x) * 4;

                while (y >= 0 && matchStartColor(pixelPos)) { y--; pixelPos -= w * 4; }
                pixelPos += w * 4; y++;

                let reachLeft = false, reachRight = false;
                while (y < h && matchStartColor(pixelPos)) {
                    colorPixel(pixelPos);
                    if (x > 0) {
                        if (matchStartColor(pixelPos - 4)) {
                            if (!reachLeft) { pixelStack.push([x - 1, y]); reachLeft = true; }
                        } else if (reachLeft) { reachLeft = false; }
                    }
                    if (x < w - 1) {
                        if (matchStartColor(pixelPos + 4)) {
                            if (!reachRight) { pixelStack.push([x + 1, y]); reachRight = true; }
                        } else if (reachRight) { reachRight = false; }
                    }
                    y++; pixelPos += w * 4;
                }
            }

            // Convertimos la mancha de pintura en una imagen real insertada en las coordenadas del mundo vectorial
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.putImageData(newImageData, 0, 0);

            const img = new Image();
            img.onload = () => {
                appData.elements.push({
                    type: 'image',
                    src: tempCanvas.toDataURL(),
                    imgObj: img,
                    x: -appData.panX / appData.zoom, // Mapeo a las coordenadas globales
                    y: -appData.panY / appData.zoom,
                    w: w / (dpr * appData.zoom),
                    h: h / (dpr * appData.zoom),
                    opacity: appData.opacity
                });
                renderApp();
            };
            img.src = tempCanvas.toDataURL();
        }

        function handlePointerDown(e) {
            if(e.target !== canvas) return;
            flyout.classList.remove('active');
            const coords = screenToCanvasCoords(e.clientX, e.clientY);
            startX = coords.x; startY = coords.y;

            if (appData.tool === 'pan' || e.button === 1 || e.shiftKey) {
                isPanning = true; startX = e.clientX; startY = e.clientY;
                canvas.classList.add('cursor-panning');
                return;
            }

            if (appData.tool === 'select') {
                if (selectedIndex !== -1) {
                    let bbox = getElementBBox(appData.elements[selectedIndex]);
                    let handles = getResizeHandles(bbox);
                    for (let h of handles) {
                        // FIX: Ampliamos el hit-area dinámicamente si estamos muy lejos
                        if (Math.hypot(startX - h.x, startY - h.y) < (16 / appData.zoom)) { 
                            activeResizeHandle = h.id; 
                            // Guardamos el estado original absoluto para re-escalar limpiamente
                            appDataResizeOriginal = JSON.parse(JSON.stringify(appData.elements[selectedIndex]));
                            pushState(); 
                            return; 
                        }
                    }
                }
                selectedIndex = -1;
                for (let i = appData.elements.length - 1; i >= 0; i--) {
                    let bbox = getElementBBox(appData.elements[i]);
                    let p = 8 / appData.zoom;
                    if (startX >= bbox.x - p && startX <= bbox.x + bbox.w + p && startY >= bbox.y - p && startY <= bbox.y + bbox.h + p) {
                        selectedIndex = i; isDragging = true;
                        dragOffsetX = startX - bbox.x; dragOffsetY = startY - bbox.y;
                        break;
                    }
                }
                renderApp(); return;
            }

            if (appData.tool === 'eraser') { pushState(); eraseAt(startX, startY); isDrawing = true; return; }
            if (appData.tool === 'eyedropper') {
                const pixel = ctx.getImageData(e.clientX * window.devicePixelRatio, e.clientY * window.devicePixelRatio, 1, 1).data;
                const hex = `#${((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1)}`;
                appData.color = hex; document.getElementById('custom-color-picker').value = hex; return;
            }
            if (appData.tool === 'fill') {
                pushState();
                // Llamamos a nuestra nueva función Flood Fill tipo MS Paint
                performFloodFill(e.clientX, e.clientY, appData.color);
                return;
            }

            pushState(); isDrawing = true;
            if (appData.tool === 'pencil') currentElement = { type: 'pencil', color: appData.color, lineWidth: appData.lineWidth, opacity: appData.opacity, points: [{x: startX, y: startY}] };
            else if (['line', 'arrow'].includes(appData.tool)) currentElement = { type: appData.tool, color: appData.color, lineWidth: appData.lineWidth, opacity: appData.opacity, x1: startX, y1: startY, x2: startX, y2: startY };
            else if (['rectangle', 'circle', 'star'].includes(appData.tool)) currentElement = { type: appData.tool, color: appData.color, lineWidth: appData.lineWidth, opacity: appData.opacity, x: startX, y: startY, w: 0, h: 0 };
            else if (appData.tool === 'text') {
                isDrawing = false;
                promptTextModal().then(txt => {
                    if (txt) { appData.elements.push({ type: 'text', color: appData.color, fontSize: 28, opacity: appData.opacity, text: txt, x: startX, y: startY }); renderApp(); }
                });
            }
        }

        function eraseAt(x, y) {
            let initialLen = appData.elements.length;
            let p = 10 / appData.zoom;
            appData.elements = appData.elements.filter(el => {
                let bbox = getElementBBox(el);
                return !(x >= bbox.x - p && x <= bbox.x + bbox.w + p && y >= bbox.y - p && y <= bbox.y + bbox.h + p);
            });
            if (appData.elements.length !== initialLen) { if (selectedIndex >= appData.elements.length) selectedIndex = -1; renderApp(); }
        }

        function handlePointerMove(e) {
            if (isPanning) {
                appData.panX += e.clientX - startX; appData.panY += e.clientY - startY;
                startX = e.clientX; startY = e.clientY; renderApp(); return;
            }

            const coords = screenToCanvasCoords(e.clientX, e.clientY);

            if (appData.tool === 'select' && selectedIndex !== -1 && !isDragging && !activeResizeHandle) {
                let bbox = getElementBBox(appData.elements[selectedIndex]);
                let handles = getResizeHandles(bbox);
                let overHandle = handles.find(h => Math.hypot(coords.x - h.x, coords.y - h.y) < (16 / appData.zoom));
                if (overHandle) {
                    canvas.className = (overHandle.id === 'tl' || overHandle.id === 'br') ? 'cursor-resize-nwse' : 'cursor-resize-nesw';
                } else {
                    canvas.className = 'cursor-select';
                }
            }

            if (appData.tool === 'eraser' && isDrawing) { eraseAt(coords.x, coords.y); return; }

            // FIX 2: NUEVA ARQUITECTURA DE RESIZE
            if (appData.tool === 'select' && activeResizeHandle && selectedIndex !== -1) {
                let el = appData.elements[selectedIndex];
                let orig = appDataResizeOriginal;
                let origBBox = getElementBBox(orig);

                let newX = origBBox.x, newY = origBBox.y, newW = origBBox.w, newH = origBBox.h;

                if (activeResizeHandle === 'br') { newW = coords.x - origBBox.x; newH = coords.y - origBBox.y; }
                else if (activeResizeHandle === 'tl') { newX = coords.x; newY = coords.y; newW = origBBox.x + origBBox.w - coords.x; newH = origBBox.y + origBBox.h - coords.y; }
                else if (activeResizeHandle === 'tr') { newY = coords.y; newW = coords.x - origBBox.x; newH = origBBox.y + origBBox.h - coords.y; }
                else if (activeResizeHandle === 'bl') { newX = coords.x; newW = origBBox.x + origBBox.w - coords.x; newH = coords.y - origBBox.y; }

                // Evitamos dimensiones negativas bloqueando el mínimo en 5px
                if (newW < 5) newW = 5;
                if (newH < 5) newH = 5;

                if (['rectangle', 'circle', 'star', 'image'].includes(el.type)) {
                    el.x = newX; el.y = newY; el.w = newW; el.h = newH;
                } else if (['line', 'arrow'].includes(el.type)) {
                    let scaleX = newW / origBBox.w, scaleY = newH / origBBox.h;
                    el.x1 = newX + (orig.x1 - origBBox.x) * scaleX;
                    el.y1 = newY + (orig.y1 - origBBox.y) * scaleY;
                    el.x2 = newX + (orig.x2 - origBBox.x) * scaleX;
                    el.y2 = newY + (orig.y2 - origBBox.y) * scaleY;
                } else if (el.type === 'pencil') {
                    // Ahora se pueden redimensionar trazos a mano sin problema
                    let scaleX = newW / origBBox.w, scaleY = newH / origBBox.h;
                    el.points = orig.points.map(p => ({
                        x: newX + (p.x - origBBox.x) * scaleX,
                        y: newY + (p.y - origBBox.y) * scaleY
                    }));
                }
                renderApp(); return;
            }

            if (appData.tool === 'select' && isDragging && selectedIndex !== -1) {
                let el = appData.elements[selectedIndex];
                let bbox = getElementBBox(el);
                let dx = coords.x - dragOffsetX - bbox.x, dy = coords.y - dragOffsetY - bbox.y;
                if (el.type === 'pencil') el.points.forEach(p => { p.x += dx; p.y += dy; });
                else if (['line', 'arrow'].includes(el.type)) { el.x1 += dx; el.y1 += dy; el.x2 += dx; el.y2 += dy; }
                else { el.x += dx; el.y += dy; }
                renderApp(); return;
            }

            if (!isDrawing || !currentElement) return;
            if (currentElement.type === 'pencil') currentElement.points.push({x: coords.x, y: coords.y});
            else if (['line', 'arrow'].includes(currentElement.type)) { currentElement.x2 = coords.x; currentElement.y2 = coords.y; }
            else { currentElement.w = coords.x - startX; currentElement.h = coords.y - startY; }
            renderApp();
        }

        function handlePointerUp() {
            if (isPanning) canvas.classList.remove('cursor-panning');
            isPanning = false; activeResizeHandle = null; updateCursor();
            if (isDragging) { isDragging = false; saveAuto(); }
            if (!isDrawing) return;
            isDrawing = false;
            if (currentElement) { appData.elements.push(currentElement); currentElement = null; renderApp(); }
        }

        window.onload = initApp;
    </script>
</body>
</html>
